[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "traveltriage"
version = "0.1.0"
description = "Impossible-travel alert triage: per-user ASN and IP-prefix history scoring for sign-in logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
traveltriage = "traveltriage.cli:main"

[tool.setuptools]
packages = ["traveltriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
